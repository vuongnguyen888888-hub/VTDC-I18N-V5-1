[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================================
# Security Headers
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com;"

# Static assets — long cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 301 Legacy Redirects — phải đứng TRƯỚC rule SPA catch-all
[[redirects]]
  from = "/viettel-cloud-server"
  to = "/services/compute/cloud-server/"
  status = 301
  force = true

[[redirects]]
  from = "/viettel-cloud-server/"
  to = "/services/compute/cloud-server/"
  status = 301
  force = true

[[redirects]]
  from = "/viettel-voks"
  to = "/services/containers/kubernetes-service/"
  status = 301
  force = true

[[redirects]]
  from = "/cwaf-web-firewall"
  to = "/services/security/cwaf/"
  status = 301
  force = true

[[redirects]]
  from = "/dich-vu-tong-the"
  to = "/services/"
  status = 301
  force = true

# ============================================================
# VN English legacy redirect — FR-GLB-03A
# ============================================================
# Hai đường dẫn /en tồn tại song song trên hai hostname khác nhau:
#
#   viettelidc.com.vn/en/...  -> LEGACY, phải 301 sang /en-vn/   (rule dưới đây)
#   viettelidc.com/en/...     -> Global market, hreflang "en" và là x-default.
#                                TUYỆT ĐỐI KHÔNG redirect.
#
# Vì vậy `from` phải là URL tuyệt đối có hostname .com.vn. Netlify chỉ áp dụng
# rule cho đúng domain đó. KHÔNG được viết from = "/en" (không có hostname) —
# rule sẽ áp cho cả viettelidc.com và giết market Global.
#
# Căn cứ: LEGACY_301_REDIRECTS (đoạn bôi hồng) + ĐẶC_TẢ_YÊU_CẦU Hub-FN FR-GLB-03A.

[[redirects]]
  from = "https://viettelidc.com.vn/en"
  to = "https://viettelidc.com.vn/en-vn/"
  status = 301
  force = true

[[redirects]]
  from = "https://viettelidc.com.vn/en/*"
  to = "https://viettelidc.com.vn/en-vn/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/huong-dan/*"
  to = "https://docs.viettelidc.com.vn/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/khach-hang/dang-nhap"
  to = "https://auth.viettelidc.com.vn/login"
  status = 301
  force = true

[[redirects]]
  from = "/gio-hang/*"
  to = "https://vconsole.viettelidc.com.vn/checkout"
  status = 301
  force = true

# NOTE (RC-03, removed 2026-09-18): a "/* -> /index.html status=200" SPA
# catch-all previously stood here. This project builds with
# @netlify/plugin-nextjs (App Router, SSR) — Next.js does not emit a static
# index.html for dynamic routes, and the plugin already owns all routing that
# isn't matched by the redirects above. Keeping that rule risked masking or
# conflicting with the plugin's own request handling; it served no purpose in
# this architecture and has been deleted rather than fixed in place.
